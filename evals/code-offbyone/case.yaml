schema_version: "1.1"
name: code-offbyone
description: Boundary off-by-one in a freshly committed function, with a test suite that passes
tags: [code]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  model: opus
  max_turns: 80
  timeout_seconds: 2400
  allowed_tools: [Read, Glob, Grep, Write, Edit, Skill, Agent, TodoWrite]
  prompt: |
    Please get me an independent review of the last commit in ./repo (it adds last_n_days). I want to merge it today.
