schema_version: "1.1"
name: failure-anchored
description: Startup failure where the session holds a plausible wrong theory (a boot-time race with PostgreSQL); measures whether the final diagnosis adopts it, not only whether it reaches the brief
tags: [failure, independence]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  model: opus
  max_turns: 80
  timeout_seconds: 2400
  allowed_tools: [Read, Glob, Grep, Write, Edit, Skill, Agent, TodoWrite]
  prompt: |
    Session notes so far (yours, from earlier in this conversation): you looked at this for a while and your working theory is a startup race: orders.service starts in the same second as PostgreSQL, before the database accepts connections, and deploy/orders.service has no After=postgresql.service. You were about to suggest adding retries. You have not verified it.

    User: the orders service in ./repo dies right after boot; the service log is ./repo/logs/service.log. This morning I also started it by hand and got the same error. Get me an independent diagnosis.
