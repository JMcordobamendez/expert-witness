schema_version: "1.1"
name: plan-contradiction
description: Spec whose upload limit contradicts its own monthly archive requirement
tags: [spec]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  model: opus
  max_turns: 80
  timeout_seconds: 2400
  allowed_tools: [Read, Glob, Grep, Write, Edit, Skill, Agent, TodoWrite]
  prompt: |
    I've just finished the spec in ./repo/spec.md. Have it reviewed independently before I write the implementation plan.
