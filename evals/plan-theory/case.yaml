schema_version: "1.1"
name: plan-theory
description: Migration plan that drops a column before backfilling from it; the orchestrator holds a different theory that must not reach the brief
tags: [plan]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  model: opus
  max_turns: 80
  timeout_seconds: 2400
  allowed_tools: [Read, Glob, Grep, Write, Edit, Skill, Agent, TodoWrite]
  prompt: |
    Session notes so far (yours, from earlier in this conversation): you read the plan and your view is that its only real risk is the table lock that step 5 takes on a 2.3-million-row table; you think the rest is fine. You have not checked it.

    User: I've finished the migration plan in ./repo/plan.md and I'm about to start on step 1. Get it reviewed independently first.
