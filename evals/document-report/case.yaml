schema_version: "1.1"
name: document-report
description: Board report with a false every-quarter claim and a causal non sequitur, no git repo
tags: [document]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  model: opus
  max_turns: 80
  timeout_seconds: 2400
  allowed_tools: [Read, Glob, Grep, Write, Edit, Skill, Agent, TodoWrite]
  prompt: |
    A colleague wrote ./board/report.md for the board; the data it is based on is ./board/sales-2025.csv. Critique it in detail so it can be improved.
