schema_version: "1.1"
name: quick-look
description: Negative trigger. A one-line question about a document someone wrote; the skill must stay quiet and no witness may be dispatched
tags: [trigger]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  model: opus
  max_turns: 40
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Write, Edit, Skill, Agent, TodoWrite]
  prompt: |
    Quick one: is the title of ./board/report.md OK for a board paper? A line or two is enough.
